# -----------------------------------------------------------------------------
# Glossaire — pour un lecteur non spécialiste
# -----------------------------------------------------------------------------
glossaire:
  dB(A): >-
    Décibel pondéré « A » : unité de niveau sonore corrigée pour se rapprocher de
    la sensibilité de l'oreille. +10 dB correspond à un bruit perçu environ deux
    fois plus fort.
  Lden: >-
    Niveau sonore moyen sur 24 h (day-evening-night), dans lequel le bruit du
    soir et de la nuit est volontairement pénalisé car plus gênant. C'est
    l'indicateur des cartes de bruit européennes, et celui de diagBruit.
  Lnight: Niveau sonore moyen la nuit (22 h – 6 h), mesuré ou calculé en façade.
  Risque relatif: >-
    Rapport entre le risque des personnes exposées et celui des non exposées.
    1,08 signifie un risque augmenté de 8 %.
  Rapport de cotes: >-
    Mesure proche du risque relatif, utilisée dans certaines études ; 2 signifie
    grossièrement « deux fois plus de chances » de présenter l'effet.
  Cardiopathie ischémique: >-
    Terme médical pour les maladies dues au rétrécissement des artères du cœur,
    qui le privent d'oxygène : angine de poitrine, infarctus.
  Relation dose-effet: "Le fait que le risque augmente régulièrement avec le niveau de bruit : un argument fort en faveur d'un effet réel."
  Cohorte: Étude qui suit un grand groupe de personnes pendant des années pour voir qui développe une maladie.
  Méta-analyse: Étude qui combine statistiquement les résultats de plusieurs études sur la même question.
  Revue parapluie: Synthèse de plusieurs méta-analyses ou revues systématiques.
  GRADE: Méthode internationale pour noter la qualité des preuves (élevée, modérée, faible, très faible), utilisée par l'OMS.
